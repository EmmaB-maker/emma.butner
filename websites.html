<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emma Butner | Websites</title>
    <link rel="stylesheet" href="home.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Center the computer setup and enlarge it */
        .computer-setup {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            margin: 0 auto;
            transform: scale(1.3);
            transform-origin: top center;
            padding: 2rem 0 4rem 0;
        }

        .monitor {
            width: 900px !important;
            max-width: 95vw;
        }

        .screen {
            height: 400px !important;
        }

        .screen-content {
            height: 100%;
            overflow-y: auto;
        }

        /* Make iframe fill the screen nicely */
        .website-iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .keyboard-container {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-top: 3rem;
        }
    </style>
</head>
<body>
    <div class="terminal-bar">
        <span class="terminal-dot red"></span>
        <span class="terminal-dot yellow"></span>
        <span class="terminal-dot green"></span>
        <span class="terminal-path">emma-butner/websites</span>
        <span class="cursor">_</span>
    </div>

    <header>
        <h1>EMMA BUTNER</h1>
        <div class="theme-toggle-container">
            <button class="theme-toggle-btn" id="theme-toggle" aria-label="Toggle theme">
                <i class="fas fa-sun"></i>
            </button>
        </div>
        <nav>
            <a href="index.html">~/home</a>
            <a href="aboutme.html">~/about</a>
            <a href="websites.html">~/websites</a>
            <a href="experiment.html">~/projects</a>
            <a href="p&p.html">~/publications</a>
        </nav>
    </header>

    <main>
        <div class="section-header">
            <span class="section-prompt">$ websites</span>
            <span class="section-line"></span>
        </div>

        <!-- Computer Setup (centered & enlarged) -->
        <div class="computer-setup">
            <!-- Computer Tower -->
            <div class="tower">
                <div class="tower-front">
                    <div class="tower-led"></div>
                </div>
            </div>

            <!-- Monitor -->
            <div class="monitor">
                <div class="screen">
                    <div class="website-tabs">
                        <div class="website-tab active" onclick="showFamilyTree()">Family Tree</div>
                        <div class="website-tab" onclick="showProfile()">Profile</div>
                    </div>
                    <div class="screen-content">
                        <!-- Family Tree Website Header -->
                        <div class="ft-header">
                            <div class="ft-header-title">
                                <h1 id="ft-page-title">Welcome to our Family Tree!</h1>
                                <nav>
                                    <a href="#" onclick="showPage('home')">Home</a>
                                    <a href="#" onclick="showPage('contributions')">Contributions</a>
                                    <a href="#" onclick="showPage('history')">History & Stories</a>
                                    <a href="#" onclick="showPage('about')">About</a>
                                </nav>
                            </div>
                        </div>
                        
                        <!-- Website Image Container -->
                        <img src="site-images/comp.home.jpeg" alt="Family Tree Home Page" class="website-image" id="current-image">
                    </div>
                </div>
                <div class="monitor-stand"></div>
            </div>

            <!-- Slanted Keyboard -->
            <div class="keyboard-container">
                <div class="keyboard">
                    <div class="keyboard-top">
                        <div class="key-row">
                            <div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div>
                            <div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div>
                            <div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div>
                            <div class="key"></div><div class="key"></div>
                        </div>
                        <div class="key-row">
                            <div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div>
                            <div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div>
                            <div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div>
                            <div class="key"></div><div class="key"></div>
                        </div>
                        <div class="key-row">
                            <div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div>
                            <div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div>
                            <div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div>
                        </div>
                        <div style="text-align: center;">
                            <div class="key-space"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div class="footer-line"></div>
        <div class="footer-content">
            <span class="footer-cmd">emma-butner — last commit: 2026</span>
        </div>
    </footer>

    <script>
        // Family Tree page switching
        function showPage(page) {
            const title = document.getElementById('ft-page-title');
            const image = document.getElementById('current-image');
            const navLinks = document.querySelectorAll('.ft-header-title nav a');
            
            // Reset all nav links
            navLinks.forEach(link => {
                link.style.fontWeight = 'normal';
                link.style.backgroundColor = 'transparent';
            });
            
            // Update based on selected page
            if (page === 'home') {
                title.textContent = 'Welcome to our Family Tree!';
                image.src = 'site-images/comp.home.jpeg';
                navLinks[0].style.fontWeight = 'bold';
                navLinks[0].style.backgroundColor = 'rgba(0,0,0,0.1)';
            } else if (page === 'contributions') {
                title.textContent = 'Contributions to the Family Tree';
                image.src = 'site-images/comp.contributions.jpeg';
                navLinks[1].style.fontWeight = 'bold';
                navLinks[1].style.backgroundColor = 'rgba(0,0,0,0.1)';
            } else if (page === 'history') {
                title.textContent = 'History & Stories';
                image.src = 'site-images/comp.history.jpeg';
                navLinks[2].style.fontWeight = 'bold';
                navLinks[2].style.backgroundColor = 'rgba(0,0,0,0.1)';
            } else if (page === 'about') {
                title.textContent = 'About this Website';
                image.src = 'site-images/comp.about.jpeg';
                navLinks[3].style.fontWeight = 'bold';
                navLinks[3].style.backgroundColor = 'rgba(0,0,0,0.1)';
            }
            
            document.querySelector('.screen-content').scrollTop = 0;
        }

        // Profile (Jade Butner) - embedded website
        function showProfile() {
            const screenContent = document.querySelector('.screen-content');
            const tabs = document.querySelectorAll('.website-tab');
            
            // Update active tab
            tabs[0].classList.remove('active');
            tabs[1].classList.add('active');
            
            // Embed the Jade Butner website
            screenContent.innerHTML = `
                <div class="profile-header">
                    <div class="profile-header-title">
                        <a href="https://jadebutner.github.io/index.html" class="contact-link" target="_blank">Website Link</a>

                    </div>
                </div>
                <iframe src="https://jadebutner.github.io/productions.html" class="website-iframe" title="Jade Butner Productions"></iframe>
            `;
        }

        function showProfilePage(page) {
            const iframe = document.querySelector('.website-iframe');
            const navLinks = document.querySelectorAll('.profile-header-title nav a');
            
            if (navLinks.length > 0) {
                navLinks.forEach(link => {
                    link.style.fontWeight = 'normal';
                    link.style.backgroundColor = 'transparent';
                });
            }
            
            if (page === 'about') {
                if (navLinks[0]) navLinks[0].style.fontWeight = 'bold';
                if (iframe) iframe.src = 'https://jadebutner.github.io/';
            } else if (page === 'productions') {
                if (navLinks[1]) navLinks[1].style.fontWeight = 'bold';
                if (iframe) iframe.src = 'https://jadebutner.github.io/productions.html';
            }
        }

        // Tab switching functions
        function showFamilyTree() {
            const screenContent = document.querySelector('.screen-content');
            const tabs = document.querySelectorAll('.website-tab');
            
            tabs[0].classList.add('active');
            tabs[1].classList.remove('active');
            
            screenContent.innerHTML = `
                <div class="ft-header">
                    <div class="ft-header-title">
                        <h1 id="ft-page-title">Welcome to our Family Tree!</h1>
                        <nav>
                            <a href="#" onclick="showPage('home')">Home</a>
                            <a href="#" onclick="showPage('contributions')">Contributions</a>
                            <a href="#" onclick="showPage('history')">History & Stories</a>
                            <a href="#" onclick="showPage('about')">About</a>
                        </nav>
                    </div>
                </div>
                <img src="site-images/comp.home.jpeg" alt="Family Tree Home Page" class="website-image" id="current-image">
            `;
        }

        // Theme Toggle with localStorage persistence
        const themeToggle = document.getElementById('theme-toggle');

        // Check saved preference on page load
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'light') {
            document.body.classList.add('light-theme');
            themeToggle.innerHTML = '<i class="fas fa-moon"></i>';
        } else {
            document.body.classList.remove('light-theme');
            themeToggle.innerHTML = '<i class="fas fa-sun"></i>';
        }

        themeToggle.addEventListener('click', function() {
            const isLight = document.body.classList.toggle('light-theme');
            if (isLight) {
                this.innerHTML = '<i class="fas fa-moon"></i>';
                localStorage.setItem('theme', 'light');
            } else {
                this.innerHTML = '<i class="fas fa-sun"></i>';
                localStorage.setItem('theme', 'dark');
            }
        });
    </script>
</body>
</html>
